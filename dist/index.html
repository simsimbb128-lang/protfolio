    <script>
      // Set language and direction before paint to avoid a layout flash.
      ;(() => {
        try {
          const saved = localStorage.getItem('ebtisam.locale')
          const locale =
            saved === 'ar' || saved === 'en'
              ? saved
              : (navigator.language || '').toLowerCase().startsWith('ar')
                ? 'ar'
                : 'en'
          document.documentElement.lang = locale
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
        } catch {
          // Keep the document defaults when storage is unavailable.
        }
      })()
    </script>
